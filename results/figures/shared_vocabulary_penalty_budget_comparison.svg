<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="724" viewBox="0 0 1100 724" role="img"><title>Shared-vocabulary penalty under two total training budgets</title><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:26px;font-weight:700}.s{font-size:15px;fill:#526070}.a{font-size:13px;fill:#526070}.l{font-size:14px}.g{stroke:#d9e0ea}.x{stroke:#64748b;stroke-width:1.5}</style><rect width="100%" height="100%" fill="white"/><text x="110" y="48" class="t">Shared-vocabulary penalty under two total training budgets</text><text x="110" y="76" class="s">Vocabulary 1024; same fixed held-out tests. Color is the joint-training budget; shape is the resample.</text><text x="110" y="102" class="s">Penalty = (shared tokens − dedicated tokens) / dedicated tokens × 100; positive means more tokens.</text><line x1="110" y1="560.0" x2="1030" y2="560.0" class="g"/><text x="94" y="565.0" class="a" text-anchor="end">0%</text><line x1="110" y1="490.8" x2="1030" y2="490.8" class="g"/><text x="94" y="495.8" class="a" text-anchor="end">4%</text><line x1="110" y1="421.7" x2="1030" y2="421.7" class="g"/><text x="94" y="426.7" class="a" text-anchor="end">8%</text><line x1="110" y1="352.5" x2="1030" y2="352.5" class="g"/><text x="94" y="357.5" class="a" text-anchor="end">12%</text><line x1="110" y1="283.3" x2="1030" y2="283.3" class="g"/><text x="94" y="288.3" class="a" text-anchor="end">16%</text><line x1="110" y1="214.2" x2="1030" y2="214.2" class="g"/><text x="94" y="219.2" class="a" text-anchor="end">20%</text><line x1="110" y1="145.0" x2="1030" y2="145.0" class="g"/><text x="94" y="150.0" class="a" text-anchor="end">24%</text><line x1="110" y1="145" x2="110" y2="560" class="x"/><line x1="110" y1="560" x2="1030" y2="560" class="x"/><text transform="rotate(-90 32 352)" x="32" y="352" class="a" text-anchor="middle">Token-count penalty (%)</text><line x1="236" y1="325.6" x2="236" y2="302.7" stroke="#111827" stroke-width="2.5"/><line x1="225" y1="314.2" x2="247" y2="314.2"