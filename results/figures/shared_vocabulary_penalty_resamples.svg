<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img"><title>Shared-vocabulary penalty across three saved resamples</title><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:26px;font-weight:700}.s{font-size:15px;fill:#526070}.a{font-size:13px;fill:#526070}.l{font-size:14px}.g{stroke:#d9e0ea}.x{stroke:#64748b;stroke-width:1.5}</style><rect width="100%" height="100%" fill="white"/><text x="110" y="48" class="t">Shared-vocabulary penalty across three saved resamples</text><text x="110" y="76" class="s">Vocabulary 1024; fixed held-out tests; approximately 300 KB training budget per language.</text><text x="110" y="102" class="s">Penalty = (shared tokens − dedicated tokens) / dedicated tokens × 100; positive means more tokens.</text><line x1="110" y1="560.0" x2="1030" y2="560.0" class="g"/><text x="94" y="565.0" class="a" text-anchor="end">12%</text><line x1="110" y1="467.8" x2="1030" y2="467.8" class="g"/><text x="94" y="472.8" class="a" text-anchor="end">14%</text><line x1="110" y1="375.6" x2="1030" y2="375.6" class="g"/><text x="94" y="380.6" class="a" text-anchor="end">16%</text><line x1="110" y1="283.3" x2="1030" y2="283.3" class="g"/><text x="94" y="288.3" class="a" text-anchor="end">18%</text><line x1="110" y1="191.1" x2="1030" y2="191.1" class="g"/><text x="94" y="196.1" class="a" text-anchor="end">20%</text><line x1="110" y1="145" x2="110" y2="560" class="x"/><line x1="110" y1="560" x2="1030" y2="560" class="x"/><line x1="265" y1="488.3" x2="265" y2="427.2" stroke="#111827" stroke-width="3"/><rect x="259" y="451.8" width="12" height="12" fill="#111827"/><circle cx="237" cy="461.7" r="7" fill="#2563eb" stroke="white" stroke-width="1.5"/><rect x="259" y="419.4" width="12" height="12" fill="#2563eb" stroke="white" stroke-width="1.5"/><polygon points="293,478.1 286,492.1 300,492.1" fill="#2563eb" stroke="white" stroke-width="1.5"/><rect x="187" y="393.2" width="156" height="20" fill="white"/><text x="265" y="407.2" class="l" text-anchor="middle">14.22% ± 0.66 pp</text><text x="265" y="590" class="l" text-anchor="middle">English</text><line x1="570" y1="423.2" x2="570" y2="362.5" stroke="#111827" stroke-width="3"/><rect x="564" y="386.9" width="12" height="12" fill="#111827"/><circle cx="542" cy="394.2" r="7" fill="#d97706" stroke="white" stroke-width="1.5"/><rect x="564" y="416.5" width="12" height="12" fill="#d97706" stroke="white" stroke-width="1.5"/><polygon points="598,353.9 591,367.9 605,367.9" fill="#d97706" stroke="white" stroke-width="1.5"/><rect x="492" y="328.5" width="156" height="20" fill="white"/><text x="570" y="342.5" class="l" text-anchor="middle">15.62% ± 0.66 pp</text><text x="570" y="590" class="l" text-anchor="middle">Hindi</text><line x1="875" y1="278.5" x2="875" y2="231.5" stroke="#111827" stroke-width="3"/><rect x="869" y="249.0" width="12" height="12" fill="#111827"/><circle cx="847" cy="230.1" r="7" fill="#059669" stroke="white" stroke-width="1.5"/><rect x="869" y="270.8" width="12" height="12" fill="#059669" stroke="white" stroke-width="1.5"/><polygon points="903,250.1 896,264.1 910,264.1" fill="#059669" stroke="white" stroke-width="1.5"/><rect x="797" y="197.5" width="156" height="20" fill="white"/><text x="875" y="211.5" class="l" text-anchor="middle">18.61% ± 0.51 pp</text><text x="875" y="590" class="l" text-anchor="middle">Nepali</text><circle cx="720" cy="620" r="5" fill="#526070"/><text x="732" y="625" class="a">resample 1</text><rect x="825" y="615" width="10" height="10" fill="#526070"/><text x="842" y="625" class="a">resample 2</text><polygon points="940,614 934,626 946,626" fill="#526070"/><text x="952" y="625" class="a">resample 3</text><text x="110" y="655" class="a">Black square and bar: mean ± sample SD. Overlapping resamples make this descriptive, not inferential.</text></svg>