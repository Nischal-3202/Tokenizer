<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img"><title>Shared-vocabulary token-count penalty across vocabulary sizes</title><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:26px;font-weight:700}.s{font-size:15px;fill:#526070}.a{font-size:13px;fill:#526070}.l{font-size:14px}.g{stroke:#d9e0ea}.x{stroke:#64748b;stroke-width:1.5}</style><rect width="100%" height="100%" fill="white"/><text x="110" y="48" class="t">Shared-vocabulary token-count penalty across vocabulary sizes</text><text x="110" y="76" class="s">Single-run balanced vocabulary sweep; fixed ~300 KB budget per language.</text><text x="110" y="102" class="s">Penalty = (shared tokens − dedicated tokens) / dedicated tokens × 100; positive means more tokens.</text><line x1="110" y1="560.0" x2="1030" y2="560.0" class="g"/><text x="94" y="565.0" class="a" text-anchor="end">12%</text><line x1="110" y1="467.8" x2="1030" y2="467.8" class="g"/><text x="94" y="472.8" class="a" text-anchor="end">14%</text><line x1="110" y1="375.6" x2="1030" y2="375.6" class="g"/><text x="94" y="380.6" class="a" text-anchor="end">16%</text><line x1="110" y1="283.3" x2="1030" y2="283.3" class="g"/><text x="94" y="288.3" class="a" text-anchor="end">18%</text><line x1="110" y1="191.1" x2="1030" y2="191.1" class="g"/><text x="94" y="196.1" class="a" text-anchor="end">20%</text><line x1="110" y1="145" x2="110" y2="560" class="x"/><line x1="110" y1="560" x2="1030" y2="560" class="x"/><polyline points="110,387.7 570,484.0 1030,452.4" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="110" cy="387.7" r="5" fill="#2563eb"/><text x="110" y="375.7" class="l" text-anchor="middle">15.74%</text><circle cx="570" cy="484.0" r="5" fill="#2563eb"/><text x="570" y="472.0" class="l" text-anchor="middle">13.65%</text><circle cx="1030" cy="452.4" r="5" fill="#2563eb"/><text x="1042" y="472.4" class="l" text-anchor="end">14.33%</text><polyline points="110,424.0 570,402.6 1030,437.3" fill="none" stroke="#d97706" stroke-width="3"/><circle cx="110" cy="424.0" r="5" fill="#d97706"/><text x="110" y="412.0" class="l" text-anchor="middle">14.95%</text><circle cx="570" cy="402.6" r="5" fill="#d97706"/><text x="570" y="390.6" class="l" text-anchor="middle">15.41%</text><circle cx="1030" cy="437.3" r="5" fill="#d97706"/><text x="1018" y="425.3" class="l" text-anchor="end">14.66%</text><polyline points="110,305.0 570,210.3 1030,278.1" fill="none" stroke="#059669" stroke-width="3"/><circle cx="110" cy="305.0" r="5" fill="#059669"/><text x="110" y="293.0" class="l" text-anchor="middle">17.53%</text><circle cx="570" cy="210.3" r="5" fill="#059669"/><text x="570" y="198.3" class="l" text-anchor="middle">19.58%</text><circle cx="1030" cy="278.1" r="5" fill="#059669"/><text x="1018" y="266.1" class="l" text-anchor="end">18.11%</text><text x="110" y="590" class="a" text-anchor="middle">512</text><text x="570" y="590" class="a" text-anchor="middle">1024</text><text x="1030" y="590" class="a" text-anchor="middle">2048</text><line x1="760" y1="122" x2="784" y2="122" stroke="#2563eb" stroke-width="3"/><circle cx="772" cy="122" r="4" fill="#2563eb"/><text x="794" y="127" class="l">English</text><line x1="760" y1="144" x2="784" y2="144" stroke="#d97706" stroke-width="3"/><circle cx="772" cy="144" r="4" fill="#d97706"/><text x="794" y="149" class="l">Hindi</text><line x1="760" y1="166" x2="784" y2="166" stroke="#059669" stroke-width="3"/><circle cx="772" cy="166" r="4" fill="#059669"/><text x="794" y="171" class="l">Nepali</text><text x="570" y="625" class="a" text-anchor="middle">Requested vocabulary size</text><text x="110" y="655" class="a">Single deterministic balanced run per size; no resampling uncertainty is represented.</text></svg>