[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenizer-research"
version = "0.1.0"
description = "Research implementation of BPE tokenization for English, Nepali, and Hindi"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]